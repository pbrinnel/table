<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover lets the field run under the notch and the home
         indicator; the body's padding hands that space back where it matters -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- The working title, which is all this page says about itself anywhere.
         See "Staying hidden" in CLAUDE.md before adding anything to this head. -->
    <title>table</title>

    <!-- not linked from anywhere, and kept out of search results -->
    <meta name="robots" content="noindex, nofollow">

    <!-- No description, og: or twitter: tags. A preview the page doesn't have
         is a preview that can't give it away; a pasted link shows a bare URL. -->

    <meta name="theme-color" content="#ffffff">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            background: #fff;
            -webkit-text-size-adjust: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            /* svh, not vh: iOS pins vh to the viewport with its toolbars
               retracted, which puts the bottom of the field under them. The vh
               line is the fallback for browsers without svh. */
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 20px max(20px, env(safe-area-inset-right))
                     max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            /* nothing scrolls, so a drag past the field mustn't rubber-band the
               page or pull down a refresh, and a double tap mustn't zoom */
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        @font-face {
            font-family: "Patrick Hand";
            src: url("fonts/patrick-hand-latin-400-normal.woff2") format("woff2");
            font-display: block;
        }

        #stage {
            display: block;
            background: #fff;
            touch-action: none;
            max-width: 100%;
        }

        /* Debug overlay (js/debug.js): plain black on white, the game's font */
        #debug-button, #debug-panel, #debug-panel * {
            font-family: "Patrick Hand";
            color: #000;
            -webkit-user-select: text;
            user-select: text;
        }
        #debug-button {
            position: fixed;
            top: 4px;
            right: 4px;
            z-index: 20;
            background: #fff;
            border: 1px solid #000;
            border-radius: 0;
            padding: 2px 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #debug-panel {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 320px;
            max-width: 100%;
            z-index: 10;
            overflow: auto;
            background: #fff;
            border: 1px solid #000;
            padding: 8px;
            font-size: 14px;
            line-height: 1.25;
        }
        #debug-panel[hidden] { display: none; }
        #debug-panel button {
            background: #fff;
            border: 1px solid #000;
            border-radius: 0;
            padding: 2px 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #debug-panel h2 { font-size: 18px; font-weight: normal; margin: 10px 0 4px; border-bottom: 1px solid #000; }
        #debug-panel h3 { font-size: 15px; font-weight: normal; margin: 8px 0 2px; }
        #debug-panel table { border-collapse: collapse; width: 100%; }
        #debug-panel td { vertical-align: top; padding: 0 4px 0 0; }
        #debug-panel td:first-child { white-space: nowrap; }
        #debug-panel .debug-entry h3 { cursor: pointer; }
        #debug-panel .debug-entry:hover h3 { text-decoration: underline; }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>
    <button id="debug-button" type="button">DEBUG</button>
    <div id="debug-panel" hidden></div>

<!-- Load order matters. These are plain scripts sharing one scope: what one
     declares at its top level, the ones after it can see. start.js goes last.

     ?v= is a cache-buster. GitHub Pages holds files for ten minutes, so a
     deploy that changes two of them can otherwise reach someone as one new
     file and one old one. Bump all of them together, every deploy. -->
<script src="js/lib/planck.min.js?v=4"></script>
<script src="js/frame.js?v=4"></script>
<script src="js/look.js?v=4"></script>
<script src="js/table.js?v=4"></script>
<script src="js/objects.js?v=4"></script>
<script src="js/world.js?v=4"></script>
<script src="js/drag.js?v=4"></script>
<script src="js/guy.js?v=4"></script>
<script src="js/talk.js?v=4"></script>
<script src="js/debug.js?v=4"></script>
<script src="js/start.js?v=4"></script>
</body>
</html>
