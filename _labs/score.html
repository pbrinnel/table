<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>score</title>
<meta name="robots" content="noindex, nofollow">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #fff; overflow: hidden; overscroll-behavior: none; }

    /* the right margin leaves the panel's column free; js/frame.js fits the
       table into what the body has left */
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        padding: 20px;
        margin-right: 300px;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
    }

    @font-face {
        font-family: "Patrick Hand";
        src: url("../fonts/patrick-hand-latin-400-normal.woff2") format("woff2");
        font-display: block;
    }

    #stage { display: block; touch-action: none; max-width: 100%; }

    #panel {
        position: fixed;
        top: 0; right: 0; bottom: 0;
        width: 300px;
        overflow-y: auto;
        padding: 14px;
        background: #f4f4f4;
        border-left: 1px solid #000;
        font: 18px/1.25 "Patrick Hand", sans-serif;
        color: #000;
    }
    #panel h2 { font-size: 18px; font-weight: normal; margin: 14px 0 4px; text-decoration: underline; }
    #panel h2:first-child { margin-top: 0; }
    #panel p { margin: 6px 0; }
    .choices { display: flex; flex-direction: column; gap: 4px; }
    .choices button { font: inherit; text-align: left; padding: 4px 8px; border: 2px solid #000; background: #fff; color: #000; cursor: pointer; }
    .choices button.on { background: #000; color: #fff; }

    /* a phone held upright: the panel moves under the table */
    @media (max-width: 700px) {
        body { margin-right: 0; min-height: 60vh; height: 60vh; }
        #panel { top: auto; left: 0; width: auto; height: 40vh; border-left: 0; border-top: 1px solid #000; }
    }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="panel"></div>

<script>
// A mock-up, not part of the game: the real game runs as it is, and this page
// replaces the score's functions after load to compare ways of showing how the
// score adds up. The rules (what scores what) are js/score.js's, untouched.
(() => {
    // ---- feel numbers ----
    const MARGIN = 24;               // from the top and right edges of the view
    const POP_NAMED_GAP = 60;        // between stacked named pops (a name line and a math line each)
    const POP_NAME_PX = 34;
    const POP_MATH_PX = 19;
    const FADE_IN = 0.35;            // seconds a new thing takes to fade in: nothing blinks
    const EASE_RATE = 5;             // how fast receipt lines slide and fade toward their place, per second
    const RECEIPT_LINES = 6;
    const RECEIPT_W = 330;
    const RECEIPT_PAD = 12;
    const RECEIPT_ROW = 50;
    const RECEIPT_NAME_PX = 23;
    const RECEIPT_MATH_PX = 16;
    const RECEIPT_TOTAL_PX = 32;
    const RECEIPT_OLDEST_ALPHA = 0.3;   // the sixth line up is this faint
    const EDGE_INSET = 70;           // how far in from the edge an at-the-edge score starts
    const EDGE_DRIFT = 45;           // and drifts further in
    // Scores that land together are queued (Paul): each gets QUEUE_STEP seconds
    // to itself before the next one shows, so a big sweep plays out over a while
    // and nothing piles on top of anything. The total counts up with them, and the
    // end screen waits for the last.
    const QUEUE_STEP = 1.1;
    const EDGE_FADE = 0.3;           // the last part of an at-the-edge score's QUEUE_STEP, fading out
    const EDGE_PLUS_PX = 42;
    const EDGE_NAME_PX = 22;
    const EDGE_TOTAL_PX = 30;
    const BOX_PAD = 12;
    const LAST_TOTAL_PX = 58;
    const LAST_LINE_PX = 21;
    const LAST_MIN_W = 300;
    const END_MARGIN = 30;           // from the view's top and bottom
    const END_GAP = 12;              // between an end panel and the dialog box under it
    const END_PAD = 24;
    const GROUP_PX = 30;
    const GROUP_ROW = 40;
    const GROUP_W = 540;
    const FULL_W = 520;
    const FULL_W_PER_PX = 26;        // the panel is at least this many font sizes wide
    const FULL_MAX_PX = 26;
    const FULL_MIN_PX = 14;
    const FULL_MIN_REAL_PX = 10;     // on a small screen the least that is, in real pixels, so a phone can read it
    const FULL_ROW = 1.3;            // row height as a multiple of the font size
    const FULL_TOTAL_PX = 44;
    const KNOCK_SPEED = 3;           // m/s toward the nearest edge
    const CLEAR_EVERY = 100;         // ms between batches
    const CLEAR_BATCH = 3;
    const CLEAR_MOVING = 1.5;        // m/s: a thing already faster than this is left to go
    const STORE = 'table-lab-score';
    const TIMER_SECONDS = 60;        // per level; the clock starts at the first grab
    const TIMER_PX = 36;
    const TIMER_GROW = 1.3;          // the digits grow steadily to this many times their size over the last TIMER_GROW_SECS: no blinking
    const TIMER_GROW_SECS = 10;
    const EDGE_MATH_PX = 18;
    const TITLE_PX = 56;             // "Time's up!" above the score
    const TITLE_GAP = 6;
    const ROW_COL_PX = 3.6;          // B's middle column sits this many font sizes in from the right edge

    const POP_STYLES = [
        ['Now (the game today)', 'Plain +N pops, top right.'],
        ['Named', '+N and the name, with the math under.'],
        ['Running receipt', 'A check in the corner: last lines and the total.'],
        ['At the edge', 'The score where the thing went over.'],
        ['Total and last', 'The total, and the last score in a line.'],
    ];
    const END_STYLES = [
        ['Score only (today)', 'The centered Score.'],
        ['By group', 'Score, then a line per group.'],
        ['Full receipt', 'Every line, in the order they went over.'],
    ];
    const GROUPS = [
        ['plates', 'Plates'], ['cutlery', 'Cutlery'], ['glasses', 'Glasses'],
        ['cups', 'Cups and saucers'], ['other', 'Other'], ['guys', 'Guys'],
    ];

    // ---- where a new score add or multiplier goes ----
    // Add one entry here and it shows up in every display style, the math line and
    // style B's rows, with its own on/off button in the panel. `make` gets the
    // entry's context { kind: 'object' | 'guy', thing, guy, key, guysOnTable } and
    // returns a term { label, op: 'add' | 'mult', value } or null for none. An
    // entry's points are round((base + adds) x mults). `row` names the term's
    // line in style B. These rules are placeholders until Paul and dhfm91 settle them.
    const TERM_MAKERS = [
        {
            id: 'guys', name: 'Multiplier: guys on the table', row: 'Guys multiplier', on: true,
            make: ctx => ({ label: 'guys', op: 'mult', value: Math.max(1, ctx.guysOnTable) }),
        },
    ];

    // popStyle 3 is "At the edge" and endStyle 1 is "By group": Paul's favorite, 4b
    let popStyle = 3, endStyle = 1, timerOn = true;
    try {
        const s = JSON.parse(localStorage.getItem(STORE));
        if (s && s.pop >= 0 && s.pop < POP_STYLES.length) popStyle = s.pop;
        if (s && s.end >= 0 && s.end < END_STYLES.length) endStyle = s.end;
        if (s && typeof s.timer === 'boolean') timerOn = s.timer;
        if (s && s.off instanceof Array) for (const m of TERM_MAKERS) if (s.off.includes(m.id)) m.on = false;
    } catch (e) { /* works without it */ }
    const remember = () => {
        try {
            localStorage.setItem(STORE, JSON.stringify({
                pop: popStyle, end: endStyle, timer: timerOn, off: TERM_MAKERS.filter(m => !m.on).map(m => m.id),
            }));
        } catch (e) { /* works without it */ }
    };

    // ---- what the game's scoring does, written down as it happens ----
    let ledger = [];       // { key, name, n, where, group, terms, math, hasExtras, base, extras, t, a, ry }
    let clearTimer = null;
    let timerStarted = false, timeLeft = TIMER_SECONDS, timeUp = false;
    let queueNow = 0, queueEnd = 0;   // seconds; an entry shows from its start, t counting up from there
    const started = () => ledger.filter(e => e.t >= 0);
    const shownTotal = () => started().reduce((sum, e) => sum + e.n, 0);
    const queueDone = () => !ledger.length || ledger[ledger.length - 1].t >= QUEUE_STEP;
    let playFade = 1;      // the during-play display fades out as the end screen comes up

    const keyOf = kind => { for (const k in KINDS) if (KINDS[k] === kind) return k; return '?'; };
    const nameOf = key => TALK_NAMES[key] || key.replace(/([A-Z])/g, ' $1').toLowerCase();
    const groupOf = key => {
        if (/fork|knife|spoon/i.test(key)) return 'cutlery';
        if (/plate|charger/i.test(key)) return 'plates';
        if (/glass|goblet|flute/i.test(key)) return 'glasses';
        if (/cup|saucer/i.test(key)) return 'cups';
        return 'other';
    };
    const commas = n => n.toLocaleString('en-US');

    // ---- terms: every display reads an entry through these ----
    const ORDER = ['base', 'add', 'mult'];

    // Points, step by step: bases, then adds, then mults, rounding as it goes so the
    // extra points each term brought always add up to the final points.
    function settle(terms) {
        let run = 0, prev = 0, base = 0;
        const extras = [];
        for (const op of ORDER) {
            for (const term of terms.filter(t => t.op === op)) {
                if (op === 'mult') run *= term.value; else run += term.value;
                const cum = Math.round(run);
                if (op === 'base') base = cum; else extras.push({ term, pts: cum - prev });
                prev = cum;
            }
        }
        return { n: prev, base, extras };
    }

    // The short math line: the base, then each add and mult that changes anything.
    function termsMath(terms) {
        const bases = terms.filter(t => t.op === 'base');
        const shown = terms.filter(t => (t.op === 'add' && t.value !== 0) || (t.op === 'mult' && t.value !== 1));
        if (!shown.length) return { text: bases.map(t => t.label).join(' + '), hasExtras: false };
        const parts = [commas(Math.round(bases.reduce((sum, t) => sum + t.value, 0)))];
        for (const op of ['add', 'mult']) {
            for (const t of shown.filter(t => t.op === op)) {
                parts.push((op === 'add' ? '+' : '×') + (op === 'add' ? commas(t.value) : t.value) + ' ' + t.label);
            }
        }
        return { text: parts.join(' '), hasExtras: true };
    }

    // ctx: { kind, thing, guy, key, name, group, where, base: term }
    function logEntry(ctx) {
        ctx.guysOnTable = guys.filter(g => g !== ctx.guy && onTable(g.thing) && !g.leaving && !g.entrance).length;
        const terms = [ctx.base];
        for (const m of TERM_MAKERS) {
            const term = m.on && m.make(ctx);
            if (term) terms.push(Object.assign({ kind: m.row }, term));
        }
        const { n, base, extras } = settle(terms);
        const m = termsMath(terms);
        const e = { key: ctx.key, name: ctx.name, where: ctx.where, group: ctx.group, terms, n, base, extras,
            math: m.text, hasExtras: m.hasExtras, t: 0, a: 0, ry: null };
        e.start = Math.max(queueNow, queueEnd);
        queueEnd = e.start + QUEUE_STEP;
        ledger.push(e);
        addScore(n);
        scorePops[0].entry = e;
    }

    // ---- the clock ----
    // whole seconds only, no minutes (Paul)
    const clockText = s => String(s);
    const secondsLeft = () => Math.ceil(timeLeft - 1e-9);

    function timesUp() {
        timeUp = true;
        timeLeft = 0;
        letGoOfEverything();
        debugPaused = true;
        if (clearTimer) { clearInterval(clearTimer); clearTimer = null; }
    }

    function tickClock(dt, over) {
        if (!timerOn || timeUp) return;
        if (!timerStarted && things.some(t => isHeld(t.body))) timerStarted = true;
        if (!timerStarted || over || debugPaused) return;
        timeLeft = Math.max(0, timeLeft - dt);
        if (timeLeft <= 0) timesUp();
    }

    // The clock and the running total are plain text in the floor's margin above
    // the table, out of the way, with no box (Paul): the clock at the table's
    // left end, the total at its right, as the screen shows it.
    function topMargin(view) {
        const w = TABLE_W_MM / MM_PER_UNIT, h = TABLE_H_MM / MM_PER_UNIT;
        const tw = frameTurned ? h : w, th = frameTurned ? w : h;
        return { left: (view.w - tw) / 2, right: (view.w + tw) / 2, mid: (view.h - th) / 4 };
    }

    function drawClock(c, view) {
        const grow = Math.min(1, Math.max(0, (TIMER_GROW_SECS - timeLeft) / TIMER_GROW_SECS));
        const m = topMargin(view);
        c.fillStyle = INK;
        font(c, TIMER_PX * (1 + (TIMER_GROW - 1) * grow));
        text(c, clockText(secondsLeft()), m.left, m.mid, 'left', 'middle');
    }

    function installScoring() {
        const resetOrig = window.resetScore;
        window.resetScore = () => {
            resetOrig();
            ledger = [];
            queueEnd = 0;
            timerStarted = false;
            timeLeft = TIMER_SECONDS;
            timeUp = false;
            if (clearTimer) { clearInterval(clearTimer); clearTimer = null; }
        };
        window.scoreObject = t => {
            if (timeUp) return;
            const key = keyOf(t.kind);
            logEntry({
                kind: 'object', thing: t, key, name: nameOf(key), where: t.edgeAt, group: groupOf(key),
                base: { label: commas(t.kind.mass) + ' g × ' + SCORE_PER_GRAM, op: 'base', value: t.kind.mass * SCORE_PER_GRAM },
            });
        };
        window.scoreGuy = g => {
            if (g.scored || timeUp) return;
            g.scored = true;
            const first = g === guys[0];
            logEntry({
                kind: 'guy', guy: g, key: 'guy', name: first ? 'first guy' : g.gum ? 'bubblegum soldier' : 'backup',
                where: g.thing.edgeAt, group: 'guys',
                base: { label: first ? 'first guy' : 'backup', op: 'base', value: first ? SCORE_FIRST_GUY : SCORE_GUY },
            });
        };
    }

    // ---- drawing helpers ----
    const toView = p => frameTurned ? { x: LH - p.y, y: p.x } : { x: p.x, y: p.y };
    const font = (c, px) => { c.font = px + 'px "Patrick Hand"'; };
    const text = (c, s, x, y, align, base) => {
        c.textAlign = align || 'left';
        c.textBaseline = base || 'top';
        c.fillText(s, x, y);
    };
    const rule = (c, x0, x1, y) => {
        c.lineWidth = LINE_WIDTH;
        c.strokeStyle = INK;
        c.beginPath();
        c.moveTo(x0, y);
        c.lineTo(x1, y);
        c.stroke();
    };
    const gummedCount = () => things.filter(t => !isGuy(t) && onTable(t) && t.gummed).length;
    const gummedLine = n => 'Gummed: ' + n + (n === 1 ? ' thing' : ' things') + ', 0 points';

    // ---- during play ----
    const boxShown = () => playFade * Math.min(1, Math.max(0, ledger[0].t) / FADE_IN);
    function drawPlain(c, view) {
        c.fillStyle = INK;
        font(c, SCORE_POP_PX);
        scorePops.forEach((pop, i) => {
            c.globalAlpha = playFade * (1 - Math.max(0, pop.t - SCORE_POP_HOLD) / SCORE_POP_FADE);
            text(c, '+' + commas(pop.n), view.w - SCORE_POP_MARGIN, SCORE_POP_MARGIN + i * SCORE_POP_GAP, 'right');
        });
    }

    function drawNamed(c, view) {
        c.fillStyle = INK;
        const showing = started().filter(e => e.t < QUEUE_STEP + SCORE_POP_FADE).reverse();
        showing.forEach((e, i) => {
            c.globalAlpha = playFade * Math.min(1, e.t / FADE_IN) * (1 - Math.max(0, e.t - QUEUE_STEP) / SCORE_POP_FADE);
            const y = SCORE_POP_MARGIN + i * POP_NAMED_GAP, x = view.w - SCORE_POP_MARGIN;
            font(c, POP_NAME_PX);
            text(c, '+' + commas(e.n) + ' ' + e.name, x, y, 'right');
            font(c, POP_MATH_PX);
            text(c, e.math, x, y + POP_NAME_PX * 1.05, 'right');
        });
    }

    function drawReceipt(c, view, dt) {
        const lines = started();
        if (!lines.length) return;
        const bw = RECEIPT_W, bx = view.w - MARGIN - bw, by = MARGIN;
        const rowsTop = by + RECEIPT_PAD, rowsH = RECEIPT_LINES * RECEIPT_ROW;
        const bh = RECEIPT_PAD * 2 + rowsH + 10 + RECEIPT_TOTAL_PX * 1.15;
        scorePanel(c, boxShown(), bx, by, bw, bh);
        c.save();
        c.beginPath();
        c.rect(bx, rowsTop, bw, rowsH);
        c.clip();
        const left = bx + RECEIPT_PAD, right = bx + bw - RECEIPT_PAD;
        for (let rank = 0; rank <= RECEIPT_LINES; rank++) {
            const e = lines[lines.length - 1 - rank];
            if (!e) break;
            const slot = rowsTop + (RECEIPT_LINES - 1 - rank) * RECEIPT_ROW;
            const want = rank >= RECEIPT_LINES ? 0 : 1 - (1 - RECEIPT_OLDEST_ALPHA) * rank / (RECEIPT_LINES - 1);
            if (e.ry === null) e.ry = slot + RECEIPT_ROW * 0.6;
            const k = Math.min(1, dt * EASE_RATE);
            e.ry += (slot - e.ry) * k;
            e.a += (want - e.a) * k;
            c.globalAlpha = e.a * playFade;
            c.fillStyle = INK;
            font(c, RECEIPT_NAME_PX);
            const pts = commas(e.n), pw = c.measureText(pts).width, nw = c.measureText(e.name).width;
            text(c, e.name, left, e.ry);
            text(c, pts, right, e.ry, 'right');
            const dotW = c.measureText('.').width;
            const dots = Math.floor((right - left - nw - pw - 14) / dotW);
            if (dots > 0) text(c, '.'.repeat(dots), left + nw + 6, e.ry);
            font(c, RECEIPT_MATH_PX);
            text(c, e.math, left, e.ry + RECEIPT_NAME_PX * 1.05);
        }
        c.restore();
        c.globalAlpha = boxShown();
        const ruleY = rowsTop + rowsH + 4;
        rule(c, left, right, ruleY);
        c.fillStyle = INK;
        font(c, RECEIPT_TOTAL_PX);
        text(c, 'Total', left, ruleY + 6);
        text(c, commas(shownTotal()), right, ruleY + 6, 'right');
    }

    function drawAtEdge(c, view) {
        const life = QUEUE_STEP;
        for (const e of ledger) {
            if (e.t < 0 || e.t >= life || !e.where) continue;
            const f = toView(mmToFrame(e.where.x * 1000, e.where.y * 1000));
            const dx = view.w / 2 - f.x, dy = view.h / 2 - f.y, d = Math.hypot(dx, dy) || 1;
            const move = EDGE_INSET + EDGE_DRIFT * Math.min(1, e.t / life);
            const x = Math.max(EDGE_INSET, Math.min(view.w - EDGE_INSET, f.x + dx / d * move));
            const y = Math.max(EDGE_PLUS_PX, Math.min(view.h - TALK_MARGIN - TALK_BOX_H - EDGE_NAME_PX * 2, f.y + dy / d * move));
            c.globalAlpha = playFade * Math.min(1, e.t / FADE_IN) * (1 - Math.max(0, e.t - (life - EDGE_FADE)) / EDGE_FADE);
            c.fillStyle = INK;
            font(c, EDGE_PLUS_PX);
            text(c, '+' + commas(e.n), x, y, 'center', 'bottom');
            font(c, EDGE_NAME_PX);
            text(c, e.name, x, y, 'center', 'top');
            if (e.hasExtras) {
                font(c, EDGE_MATH_PX);
                text(c, e.math, x, y + EDGE_NAME_PX * 1.05, 'center', 'top');
            }
        }
        if (!started().length) return;
        const m = topMargin(view);
        c.globalAlpha = boxShown();
        c.fillStyle = INK;
        font(c, EDGE_TOTAL_PX);
        text(c, 'Total ' + commas(shownTotal()), m.right, m.mid, 'right', 'middle');
    }

    function drawTotalAndLast(c, view) {
        const lines = started();
        if (!lines.length) return;
        const e = lines[lines.length - 1];
        const line = '+' + commas(e.n) + ': ' + e.name + ', ' + e.math;
        const maxW = view.w - MARGIN * 2 - BOX_PAD * 2;
        let px = LAST_LINE_PX;
        font(c, px);
        const natural = c.measureText(line).width;
        if (natural > maxW) { px = Math.floor(px * maxW / natural); font(c, px); }
        const lw = c.measureText(line).width;
        font(c, LAST_TOTAL_PX);
        const tw = c.measureText(commas(shownTotal())).width;
        const bw = Math.max(LAST_MIN_W, lw, tw) + BOX_PAD * 2, bh = LAST_TOTAL_PX * 1.1 + px * 1.2 + BOX_PAD * 2;
        scorePanel(c, boxShown(), view.w - MARGIN - bw, MARGIN, bw, bh);
        c.fillStyle = INK;
        text(c, commas(shownTotal()), view.w - MARGIN - BOX_PAD, MARGIN + BOX_PAD, 'right');
        c.globalAlpha = playFade * Math.min(1, e.t / FADE_IN);
        font(c, px);
        text(c, line, view.w - MARGIN - BOX_PAD, MARGIN + BOX_PAD + LAST_TOTAL_PX * 1.1, 'right');
    }

    // ---- at the end ----
    const titleH = () => timeUp ? TITLE_PX * 1.1 + TITLE_GAP : 0;
    function drawTitle(c, cx, y) {
        if (!timeUp) return;
        font(c, TITLE_PX);
        text(c, "Time's up!", cx, y, 'center');
    }

    function drawEndScore(c, view, shown) {
        const s = 'Score: ' + commas(score);
        font(c, TITLE_PX);
        const titleW = timeUp ? c.measureText("Time's up!").width : 0;
        font(c, SCORE_FONT_PX);
        const w = Math.max(c.measureText(s).width, titleW);
        const h = SCORE_FONT_PX * 1.1 + titleH() + SCORE_PANEL_PAD * 2, top = view.h / 2 - h / 2;
        scorePanel(c, shown, view.w / 2 - w / 2 - SCORE_PANEL_PAD, top, w + SCORE_PANEL_PAD * 2, h);
        drawTitle(c, view.w / 2, top + SCORE_PANEL_PAD);
        font(c, SCORE_FONT_PX);
        text(c, s, view.w / 2, top + SCORE_PANEL_PAD + titleH(), 'center');
    }

    // the band the end panels use: above the dialog box, which stays up after the score
    const endBand = view => ({ top: END_MARGIN, bottom: view.h - TALK_MARGIN - TALK_BOX_H - END_GAP });

    // The least a row's font may be, in view units: FULL_MIN_PX, or FULL_MIN_REAL_PX real pixels on a small screen.
    const minRowPx = view => Math.max(FULL_MIN_PX, FULL_MIN_REAL_PX * view.w / canvas.getBoundingClientRect().width);

    // Rows are [label, middle, right]; a term kind's right column is its extra points.
    function endRows() {
        const rows = [];
        for (const [g, label] of GROUPS) {
            const mine = ledger.filter(e => e.group === g);
            if (!mine.length) continue;
            const pieces = g === 'guys' ? String(mine.length) : mine.length + (mine.length === 1 ? ' piece' : ' pieces');
            rows.push([label, pieces, commas(mine.reduce((sum, e) => sum + e.base, 0))]);
        }
        const kinds = [];
        for (const e of ledger) for (const x of e.extras) {
            let k = kinds.find(k => k.name === x.term.kind);
            if (!k) kinds.push(k = { name: x.term.kind, pts: 0 });
            k.pts += x.pts;
        }
        for (const k of kinds) if (k.pts) rows.push([k.name, '', (k.pts > 0 ? '+' : '-') + commas(Math.abs(k.pts))]);
        const gum = gummedCount();
        if (gum) rows.push(['Gummed', gum + (gum === 1 ? ' thing' : ' things'), '0']);
        const left = things.filter(inPlay).length;
        if (left) rows.push(['Left on the table', left + (left === 1 ? ' piece' : ' pieces'), '']);
        if (timerOn && !timeUp) rows.push(['Time left', clockText(secondsLeft()) + ' s', '']);
        return rows;
    }

    function drawEndGroups(c, view, shown) {
        const rows = endRows();
        const w = Math.min(GROUP_W, view.w - END_MARGIN * 2);
        const band = endBand(view);
        const head = titleH() + SCORE_FONT_PX * 1.1 + 14;
        // the rows (and the rule and total under them) shrink to fit above the dialog box
        const rowsH = px => (rows.length + 1) * px * GROUP_ROW / GROUP_PX + 14;
        const avail = band.bottom - band.top - END_PAD * 2 - head;
        const px = Math.max(minRowPx(view), Math.min(GROUP_PX, GROUP_PX * avail / rowsH(GROUP_PX)));
        const rowH = px * GROUP_ROW / GROUP_PX;
        const h = END_PAD * 2 + head + rowsH(px);
        const x = view.w / 2 - w / 2, y = (band.top + band.bottom) / 2 - h / 2;
        scorePanel(c, shown, x, y, w, h);
        c.fillStyle = INK;
        drawTitle(c, view.w / 2, y + END_PAD);
        font(c, SCORE_FONT_PX);
        text(c, 'Score: ' + commas(score), view.w / 2, y + END_PAD + titleH(), 'center');
        const left = x + END_PAD, right = x + w - END_PAD, mid = right - px * ROW_COL_PX;
        let ry = y + END_PAD + head;
        font(c, px);
        for (const [label, middle, pts] of rows) {
            text(c, label, left, ry);
            text(c, middle, mid, ry, 'right');
            text(c, pts, right, ry, 'right');
            ry += rowH;
        }
        rule(c, left, right, ry + 2);
        ry += 14;
        text(c, 'Total', left, ry);
        text(c, commas(score), right, ry, 'right');
    }

    function drawEndFull(c, view, shown) {
        const gum = gummedCount();
        const band = endBand(view), maxH = band.bottom - band.top;
        const minPx = minRowPx(view);
        const gumH = gum ? minPx * 2 : 0;
        const avail = maxH - END_PAD * 2 - titleH() - gumH - FULL_TOTAL_PX * 1.25 - 14;
        const n = ledger.length;
        let px = Math.min(FULL_MAX_PX, avail / (Math.max(1, n) * FULL_ROW));
        let list = ledger, more = 0;
        if (px < minPx) {
            px = minPx;
            const fit = Math.max(2, Math.floor(avail / (px * FULL_ROW)));
            more = n - (fit - 1);
            list = ledger.slice(more);
        }
        const rowH = px * FULL_ROW, rowCount = list.length + (more ? 1 : 0);
        const w = Math.min(Math.max(FULL_W, px * FULL_W_PER_PX), view.w - END_MARGIN * 2);
        const h = END_PAD * 2 + titleH() + rowCount * rowH + 14 + gumH + FULL_TOTAL_PX * 1.25;
        const x = view.w / 2 - w / 2, y = (band.top + band.bottom) / 2 - h / 2;
        scorePanel(c, shown, x, y, w, h);
        c.fillStyle = INK;
        drawTitle(c, view.w / 2, y + END_PAD);
        const left = x + END_PAD, right = x + w - END_PAD;
        let ry = y + END_PAD + titleH();
        font(c, px);
        if (more) { text(c, '… and ' + more + ' more', left, ry); ry += rowH; }
        for (const e of list) {
            font(c, px);
            text(c, e.name, left, ry);
            text(c, commas(e.n), right, ry, 'right');
            font(c, px * 0.8);
            text(c, e.math, right - px * 3.6, ry + px * 0.1, 'right');
            ry += rowH;
        }
        rule(c, left, right, ry + 4);
        ry += 14;
        if (gum) { font(c, px); text(c, gummedLine(gum), left, ry); ry += gumH; }
        font(c, FULL_TOTAL_PX);
        text(c, 'Total', left, ry);
        text(c, commas(score), right, ry, 'right');
    }

    function installDrawing() {
        window.drawScore = (c, dt) => {
            c.save();
            const view = uprightView(c);
            c.textBaseline = 'top';
            for (const pop of scorePops) pop.t += dt;
            scorePops = scorePops.filter(pop => pop.t < SCORE_POP_HOLD + SCORE_POP_FADE);
            queueNow += dt;
            for (const e of ledger) e.t = queueNow - e.start;
            const over = runOver();
            tickClock(dt, over);
            playFade = scoreShown === null ? 1 : Math.max(0, 1 - scoreShown / SCORE_FADE_TIME);
            if (popStyle === 0) drawPlain(c, view);
            else if (popStyle === 1) drawNamed(c, view);
            else if (popStyle === 2) drawReceipt(c, view, dt);
            else if (popStyle === 3) drawAtEdge(c, view);
            else drawTotalAndLast(c, view);
            c.globalAlpha = 1;
            if (timerOn) drawClock(c, view);
            c.globalAlpha = 1;

            if ((over || timeUp) && queueDone()) {
                // the first guy has his last word as the score comes up
                if (scoreShown === null) {
                    scoreShown = 0;
                    say(TALK_DAMAGE, 'sad', null);
                }
                scoreShown += dt;
                const shown = Math.min(1, scoreShown / SCORE_FADE_TIME);
                if (endStyle === 0) drawEndScore(c, view, shown);
                else if (endStyle === 1) drawEndGroups(c, view, shown);
                else drawEndFull(c, view, shown);
            }
            c.restore();
        };
    }

    // ---- knocking things off ----
    function knock(t) {
        const p = t.body.getPosition();
        const hw = TABLE_W_MM / 2000, hh = TABLE_H_MM / 2000;
        const v = hw - Math.abs(p.x) < hh - Math.abs(p.y) ? planck.Vec2(Math.sign(p.x) || 1, 0) : planck.Vec2(0, Math.sign(p.y) || 1);
        t.body.setAwake(true);
        t.body.setLinearVelocity(planck.Vec2(v.x * KNOCK_SPEED, v.y * KNOCK_SPEED));
    }
    const pick = list => list[Math.floor(Math.random() * list.length)];
    function knockSomething() {
        const all = things.filter(inPlay);
        if (!all.length) return;
        const cloth = all.filter(t => !t.on);
        knock(pick(cloth.length ? cloth : all));
    }
    function knockGuy() {
        const on = guys.filter(g => onTable(g.thing));
        if (on.length) knock(pick(on).thing);
    }
    function clearTable() {
        if (clearTimer) clearInterval(clearTimer);
        clearTimer = setInterval(() => {
            // topmost first, so a stack comes down level by level
            const rest = things.filter(t => inPlay(t) && t.drop === undefined).sort((a, b) => b.level - a.level);
            if (things.some(inPlay)) {
                rest.filter(t => t.body.getLinearVelocity().length() < CLEAR_MOVING).slice(0, CLEAR_BATCH).forEach(knock);
                return;
            }
            guys.filter(g => onTable(g.thing)).forEach(g => knock(g.thing));
            clearInterval(clearTimer);
            clearTimer = null;
        }, CLEAR_EVERY);
    }

    // ---- the panel ----
    function buildPanel() {
        const panel = document.getElementById('panel');
        const add = (tag, s, parent) => {
            const el = document.createElement(tag);
            if (s) el.textContent = s;
            (parent || panel).appendChild(el);
            return el;
        };
        add('h2', 'About');
        add('p', 'The real game, with different ways to show where the score comes from. Nothing about what scores what changes.');
        add('p', 'An object scores its weight in grams × ' + SCORE_PER_GRAM + '. A guy scores ' + SCORE_FIRST_GUY
            + ' for the first guy and ' + SCORE_GUY + ' for any other, the first time he goes over only. Things saved by gum score nothing.');
        add('p', 'The credits are left out of the end screen here.');
        add('p', 'Added here, and only a placeholder until Paul and dhfm91 settle the rules: each score is a list of terms (a base, adds, mults), and every display style reads them, so a new add or mult shows up everywhere. The first mult is the number of guys on the table, so saving a big plate for the end pays. A ' + TIMER_SECONDS + ' second clock starts at the first grab; at 0 everything stops and the end screen comes up.');

        const group = (title, styles, get, set, labels) => {
            add('h2', title);
            const box = add('div');
            box.className = 'choices';
            const buttons = styles.map(([name, note], i) => {
                const b = add('button', labels[i] + '. ' + name, box);
                b.title = note;
                b.addEventListener('click', () => { set(i); refresh(); remember(); });
                return b;
            });
            const refresh = () => buttons.forEach((b, i) => b.classList.toggle('on', i === get()));
            refresh();
        };
        group('During play', POP_STYLES, () => popStyle, i => { popStyle = i; }, ['1', '2', '3', '4', '5']);
        group('At the end', END_STYLES, () => endStyle, i => { endStyle = i; }, ['A', 'B', 'C']);

        add('h2', 'Score terms');
        const tbox = add('div');
        tbox.className = 'choices';
        const toggle = (label, get, set) => {
            const b = add('button', '', tbox);
            const refresh = () => { b.textContent = label + ': ' + (get() ? 'on' : 'off'); b.classList.toggle('on', get()); };
            b.addEventListener('click', () => { set(!get()); refresh(); remember(); });
            refresh();
        };
        for (const m of TERM_MAKERS) toggle(m.name, () => m.on, v => { m.on = v; });
        toggle('Timer (' + TIMER_SECONDS + ' s)', () => timerOn, v => { timerOn = v; });

        add('h2', 'Try it');
        const box = add('div');
        box.className = 'choices';
        const button = (label, fn) => add('button', label, box).addEventListener('click', fn);
        button('Knock something off', knockSomething);
        button('Knock a guy off', knockGuy);
        button('Clear the table', clearTable);
        button('Reset table', () => { setTable(TEST_LAYOUT); debugPaused = false; });
    }

    async function loadGame() {
        const html = await (await fetch('../index.html')).text();
        const srcs = [...html.matchAll(/<script\s+src="([^"]+)"/g)].map(m => m[1].replace(/\?v=.*$/, ''));
        const texts = await Promise.all(srcs.map(async s => {
            const r = await fetch('../' + s);
            if (!r.ok) throw new Error(s + ': ' + r.status);
            return r.text();
        }));
        srcs.forEach((s, i) => {
            const el = document.createElement('script');
            el.textContent = texts[i];
            document.body.appendChild(el);
        });
    }

    loadGame().then(() => {
        document.fonts.load('20px "Patrick Hand"');
        installScoring();
        installDrawing();
        buildPanel();
    }).catch(e => {
        document.getElementById('panel').textContent = (location.protocol === 'file:' ? 'Labs need the local server: double-click _labs-mac.command (or _labs-windows.bat on Windows) in the repo folder.' : 'Failed to load the game: ' + e.message);
    });
})();
</script>
